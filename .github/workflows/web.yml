name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The .glb models are stored in Git LFS; without this the site would ship 130-byte pointer files.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The shared rules must replay identically under Kotlin/JS before a build is published.
      - name: Shared simulation tests on Kotlin/JS
        run: ./gradlew :simulation:jsNodeTest :shared:jsNodeTest --console=plain

      - name: Build the web bundle
        run: ./gradlew :webApp:jsBrowserDistribution --console=plain

      - name: Check that no Git LFS pointers are published
        run: |
          if grep -rl --include='*.glb' 'git-lfs.github.com/spec' webApp/build/dist/js/productionExecutable/assets; then
            echo "These assets are Git LFS pointers, not models" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/js/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
