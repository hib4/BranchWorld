<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#4D8585">
    <meta name="description" content="Create a world. Fill it with life. Watch what it becomes.">
    <title>BranchWorld</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234D8585'/%3E%3Cpath d='M32 10 L46 34 H39 L50 52 H14 L25 34 H18 Z' fill='%23E9CFA0'/%3E%3Crect x='29' y='50' width='6' height='8' fill='%236B4A2E'/%3E%3C/svg%3E">
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #4D8585;
            overscroll-behavior: none;
            touch-action: none;
        }
        /* Kool draws the world here, beneath the transparent Compose canvas that holds the interface. */
        #branchworld-kool {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
        }
        #branchworld-ui {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        #branchworld-loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F5EEDC;
            font: 600 20px/1.3 system-ui, sans-serif;
            letter-spacing: 0.02em;
            z-index: 2;
            pointer-events: none;
            transition: opacity 400ms ease;
        }
        noscript {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F5EEDC;
            font: 600 18px/1.4 system-ui, sans-serif;
            z-index: 3;
        }
    </style>
</head>
<body>
<canvas id="branchworld-kool"></canvas>
<div id="branchworld-ui"></div>
<div id="branchworld-loading">Setting the island down…</div>
<noscript>BranchWorld needs JavaScript to run in the browser.</noscript>
<script src="branchworld.js"></script>
</body>
</html>
